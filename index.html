<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SisGESC — ERP Educacional Enterprise" />
  <meta name="color-scheme" content="dark light" />
  <title>SisGESC — ERP Educacional Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.3/dist/jspdf.plugin.autotable.min.js"></script>
  <style>
    :root {
      --bg: #f5f7fb;
      --bg-elevated: #ffffff;
      --surface: #ffffff;
      --surface-2: #f8faff;
      --surface-3: #eef2f8;
      --text: #172235;
      --text-muted: #68758a;
      --text-subtle: #98a4b7;
      --border: #e5eaf2;
      --border-strong: #d6deeb;
      --primary: #6046d9;
      --primary-strong: #4b34bb;
      --primary-soft: #eeeafd;
      --cyan: #0891b2;
      --cyan-soft: #e0f7fb;
      --success: #138a62;
      --success-soft: #e5f7f0;
      --warning: #b56a08;
      --warning-soft: #fff3dd;
      --danger: #c44545;
      --danger-soft: #ffebeb;
      --info: #2563ab;
      --info-soft: #e6f0ff;
      --shadow-sm: 0 1px 2px rgba(25, 38, 65, .03), 0 4px 16px rgba(25, 38, 65, .04);
      --shadow-md: 0 14px 36px rgba(25, 38, 65, .10);
      --radius: 12px;
      --radius-lg: 18px;
      --sidebar: 256px;
      --topbar: 74px;
      --ease: cubic-bezier(.23,1,.32,1);
    }

    [data-theme="dark"] {
      --bg: #0b0e15;
      --bg-elevated: #101521;
      --surface: #131a27;
      --surface-2: #182131;
      --surface-3: #202b3e;
      --text: #edf2fb;
      --text-muted: #8e9bb0;
      --text-subtle: #617088;
      --border: rgba(164, 180, 209, .12);
      --border-strong: rgba(164, 180, 209, .22);
      --primary: #8976f2;
      --primary-strong: #aa9dff;
      --primary-soft: rgba(137, 118, 242, .14);
      --cyan: #35c8da;
      --cyan-soft: rgba(53, 200, 218, .12);
      --success: #48d3a0;
      --success-soft: rgba(72, 211, 160, .13);
      --warning: #f5b94e;
      --warning-soft: rgba(245, 185, 78, .13);
      --danger: #ff7b7b;
      --danger-soft: rgba(255, 123, 123, .12);
      --info: #75aef5;
      --info-soft: rgba(117, 174, 245, .13);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .22), 0 8px 18px rgba(0, 0, 0, .10);
      --shadow-md: 0 18px 48px rgba(0, 0, 0, .28);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { min-width: 320px; background: var(--bg); }
    body { margin: 0; min-height: 100vh; color: var(--text); background: var(--bg); font-family: "DM Sans", sans-serif; font-size: 14px; line-height: 1.45; transition: background .2s ease, color .2s ease; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--primary); color: #fff; }
    :focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 35%, transparent); outline-offset: 2px; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }

    .app-shell { min-height: 100vh; }
    .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 40; width: var(--sidebar); display: flex; flex-direction: column; padding: 18px 14px 14px; background: var(--bg-elevated); border-right: 1px solid var(--border); transition: transform .25s var(--ease), width .25s var(--ease); }
    .brand { display: flex; align-items: center; gap: 11px; padding: 4px 11px 20px; }
    .brand-mark { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 11px; color: white; background: linear-gradient(135deg, #6b4ee6, #22c2d8); box-shadow: 0 8px 22px rgba(96, 70, 217, .32); font: 800 17px/1 "Manrope", sans-serif; }
    .brand-name { font: 800 18px/1.1 "Manrope", sans-serif; letter-spacing: -.6px; }
    .brand-sub { margin-top: 3px; color: var(--text-subtle); font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; }
    .tenant { display: flex; align-items: center; gap: 10px; margin: 0 4px 18px; padding: 11px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); }
    .tenant-logo { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 9px; background: var(--primary-soft); color: var(--primary); font-weight: 800; font-size: 11px; }
    .tenant-copy { min-width: 0; flex: 1; }
    .tenant-copy strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .tenant-copy span { color: var(--text-subtle); font-size: 10px; }
    .sidebar-nav { min-height: 0; overflow-y: auto; flex: 1; padding: 0 1px; }
    .nav-label { margin: 19px 11px 8px; color: var(--text-subtle); font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; }
    .nav-item { position: relative; display: flex; align-items: center; gap: 11px; width: 100%; padding: 10px 11px; border: 0; border-radius: 10px; color: var(--text-muted); background: transparent; text-align: left; transition: background .16s ease, color .16s ease, transform .16s ease; }
    .nav-item:hover { color: var(--text); background: var(--surface-2); transform: translateX(2px); }
    .nav-item.active { color: var(--primary); background: var(--primary-soft); font-weight: 700; }
    .nav-item.active::before { position: absolute; left: -14px; width: 3px; height: 22px; border-radius: 0 3px 3px 0; background: var(--primary); content: ""; }
    .nav-icon { width: 17px; height: 17px; flex: 0 0 auto; stroke: currentColor; stroke-width: 1.8; fill: none; }
    .nav-item .nav-count { margin-left: auto; min-width: 20px; padding: 2px 5px; border-radius: 20px; color: var(--primary); background: var(--primary-soft); font-size: 10px; text-align: center; }
    .sidebar-footer { display: flex; align-items: center; gap: 9px; margin-top: 13px; padding: 12px 7px 1px; border-top: 1px solid var(--border); }
    .avatar { width: 32px; height: 32px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 10px; color: #fff; background: linear-gradient(135deg, #6b4ee6, #22c2d8); font-size: 11px; font-weight: 800; }
    .avatar-copy { min-width: 0; flex: 1; }
    .avatar-copy strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .avatar-copy span { color: var(--text-subtle); font-size: 10px; }
    .main { min-height: 100vh; margin-left: var(--sidebar); }
    .topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; min-height: var(--topbar); padding: 14px 30px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg-elevated) 88%, transparent); backdrop-filter: blur(16px); }
    .topbar-left, .topbar-actions, .inline, .page-actions { display: flex; align-items: center; }
    .topbar-left { gap: 13px; min-width: 0; }
    .topbar-actions { gap: 9px; }
    .mobile-menu { display: none; }
    .breadcrumb { color: var(--text-subtle); font-size: 11px; }
    .breadcrumb strong { color: var(--text); font-size: 13px; }
    .search { position: relative; width: 220px; }
    .search input { width: 100%; height: 37px; padding: 0 12px 0 35px; border: 1px solid var(--border); border-radius: 10px; color: var(--text); background: var(--surface-2); outline: 0; font-size: 12px; }
    .search svg { position: absolute; top: 11px; left: 12px; width: 14px; height: 14px; stroke: var(--text-subtle); fill: none; }
    .icon-button { position: relative; display: grid; place-items: center; width: 37px; height: 37px; padding: 0; border: 1px solid var(--border); border-radius: 10px; color: var(--text-muted); background: var(--surface-2); transition: all .16s ease; }
    .icon-button:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-3); }
    .icon-button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .notification-dot { position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; border: 1px solid var(--surface); border-radius: 50%; background: var(--danger); }
    .content { max-width: 1680px; margin: 0 auto; padding: 28px 30px 48px; }
    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 25px; }
    .eyebrow { color: var(--primary); font-size: 10px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; }
    h1 { margin: 4px 0 0; font: 800 26px/1.15 "Manrope", sans-serif; letter-spacing: -.9px; }
    h2, h3, p { margin: 0; }
    .page-description { margin-top: 6px; color: var(--text-muted); font-size: 13px; }
    .page-actions { gap: 9px; flex-wrap: wrap; justify-content: flex-end; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 37px; padding: 0 13px; border: 1px solid transparent; border-radius: 10px; font-size: 12px; font-weight: 700; transition: transform .14s var(--ease), background .16s ease, border .16s ease, color .16s ease, box-shadow .16s ease; }
    .button:active { transform: scale(.97); }
    .button svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .button-primary { color: #fff; background: var(--primary); box-shadow: 0 8px 20px color-mix(in srgb, var(--primary) 25%, transparent); }
    .button-primary:hover { background: var(--primary-strong); }
    .button-secondary { border-color: var(--border-strong); color: var(--text); background: var(--surface); }
    .button-secondary:hover { background: var(--surface-3); }
    .button-quiet { border-color: var(--border); color: var(--text-muted); background: transparent; }
    .button-quiet:hover { color: var(--text); background: var(--surface-2); }
    .button-danger { border-color: color-mix(in srgb, var(--danger) 25%, transparent); color: var(--danger); background: var(--danger-soft); }
    .button-sm { min-height: 30px; padding: 0 9px; border-radius: 8px; font-size: 11px; }

    .kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 15px; margin-bottom: 18px; }
    .metric-card, .card { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); }
    .metric-card { position: relative; overflow: hidden; padding: 18px; }
    .metric-card::after { position: absolute; right: -22px; bottom: -35px; width: 100px; height: 100px; border-radius: 50%; background: var(--metric-color, var(--primary)); opacity: .10; content: ""; }
    .metric-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .metric-label { color: var(--text-muted); font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; }
    .metric-icon { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; color: var(--metric-color, var(--primary)); background: color-mix(in srgb, var(--metric-color, var(--primary)) 13%, transparent); }
    .metric-icon svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .metric-value { margin: 12px 0 6px; font: 800 27px/1 "Manrope", sans-serif; letter-spacing: -1.1px; }
    .metric-meta { display: flex; align-items: center; gap: 6px; color: var(--text-subtle); font-size: 11px; }
    .metric-meta .up { color: var(--success); }
    .metric-meta .down { color: var(--danger); }
    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, .85fr); gap: 16px; margin-bottom: 16px; }
    .dashboard-grid.equal { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .card { overflow: hidden; }
    .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 17px 19px; border-bottom: 1px solid var(--border); }
    .card-title { font: 700 14px/1.2 "Manrope", sans-serif; }
    .card-subtitle { margin-top: 4px; color: var(--text-muted); font-size: 11px; }
    .card-body { padding: 18px 19px; }
    .chart-box { min-height: 250px; padding: 16px 19px 14px; }
    .chart-box canvas { width: 100% !important; height: 235px !important; }
    .chart-box.compact { min-height: 250px; }
    .chart-box.compact canvas { height: 220px !important; }
    .activity-list { display: grid; gap: 2px; }
    .activity { display: flex; gap: 11px; padding: 11px 0; border-bottom: 1px solid var(--border); }
    .activity:last-child { border-bottom: 0; }
    .activity-dot { width: 8px; height: 8px; margin-top: 6px; flex: 0 0 auto; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
    .activity-copy { min-width: 0; flex: 1; }
    .activity-copy strong { display: block; font-size: 12px; font-weight: 600; }
    .activity-copy span { display: block; margin-top: 2px; color: var(--text-muted); font-size: 11px; }
    .activity-time { color: var(--text-subtle); font-size: 10px; white-space: nowrap; }
    .health-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border); }
    .health-row:last-child { border-bottom: 0; }
    .health-row span:first-child { color: var(--text-muted); font-size: 12px; }
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 99px; font-size: 10px; font-weight: 800; white-space: nowrap; }
    .badge::before { width: 5px; height: 5px; border-radius: 50%; background: currentColor; content: ""; }
    .badge-success { color: var(--success); background: var(--success-soft); }
    .badge-warning { color: var(--warning); background: var(--warning-soft); }
    .badge-danger { color: var(--danger); background: var(--danger-soft); }
    .badge-info { color: var(--info); background: var(--info-soft); }
    .badge-neutral { color: var(--text-muted); background: var(--surface-3); }

    .grid-shell { overflow: hidden; }
    .grid-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 15px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
    .grid-toolbar-left, .grid-toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .grid-toolbar .search { width: 220px; }
    .select-control, .input-control { height: 34px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 8px; color: var(--text); background: var(--surface); outline: 0; font-size: 11px; }
    .select-control:focus, .input-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    .grid-wrap { overflow-x: auto; }
    .data-grid { width: 100%; min-width: 720px; border-collapse: collapse; }
    .data-grid th { padding: 10px 15px 8px; border-bottom: 1px solid var(--border); color: var(--text-subtle); background: var(--surface); font-size: 10px; font-weight: 800; letter-spacing: .75px; text-align: left; text-transform: uppercase; white-space: nowrap; }
    .data-grid th .sort-button { display: inline-flex; align-items: center; gap: 5px; padding: 0; border: 0; color: inherit; background: transparent; font-size: inherit; font-weight: inherit; letter-spacing: inherit; text-transform: inherit; }
    .sort-icon { color: var(--text-subtle); font-size: 12px; }
    .filter-row th { padding: 7px 10px; background: var(--surface-2); }
    .column-filter { width: 100%; height: 27px; padding: 0 7px; border: 1px solid var(--border); border-radius: 6px; color: var(--text); background: var(--surface); outline: 0; font-size: 10px; }
    .data-grid td { padding: 13px 15px; border-bottom: 1px solid var(--border); color: var(--text); font-size: 12px; vertical-align: middle; }
    .data-grid tr:last-child td { border-bottom: 0; }
    .data-grid tbody tr { transition: background .14s ease; }
    .data-grid tbody tr:hover { background: var(--surface-2); }
    .identity { display: flex; align-items: center; gap: 9px; min-width: 180px; }
    .identity-avatar { display: grid; place-items: center; width: 30px; height: 30px; flex: 0 0 auto; border-radius: 9px; color: #fff; background: linear-gradient(135deg, #7d6ae9, #35c8da); font-size: 10px; font-weight: 800; }
    .identity strong { display: block; font-size: 12px; }
    .identity span { display: block; margin-top: 1px; color: var(--text-muted); font-size: 10px; }
    .mono { color: var(--text-subtle); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .row-actions { display: flex; align-items: center; gap: 5px; }
    .grid-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 15px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 11px; }
    .pagination { display: flex; align-items: center; gap: 5px; }
    .page-button { display: grid; place-items: center; min-width: 27px; height: 27px; padding: 0 7px; border: 1px solid var(--border); border-radius: 7px; color: var(--text-muted); background: var(--surface); font-size: 11px; }
    .page-button.active, .page-button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
    .page-button:disabled { cursor: not-allowed; opacity: .4; }
    .empty-state { padding: 42px 20px; color: var(--text-muted); text-align: center; }
    .empty-state strong { display: block; margin-bottom: 4px; color: var(--text); font-size: 13px; }

    .skeleton { position: relative; overflow: hidden; border-radius: 8px; background: var(--surface-3); }
    .skeleton::after { position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--surface) 65%, transparent), transparent); animation: shimmer 1.3s infinite; content: ""; }
    .skeleton-kpi { height: 145px; }
    .skeleton-card { height: 330px; }
    .loading-screen { display: grid; gap: 16px; }
    @keyframes shimmer { to { transform: translateX(100%); } }

    .kanban { display: grid; grid-template-columns: repeat(4, minmax(210px, 1fr)); gap: 12px; align-items: start; }
    .kanban-column { min-width: 0; border: 1px solid var(--border); border-radius: 14px; background: var(--surface-2); }
    .kanban-header { display: flex; align-items: center; justify-content: space-between; padding: 13px 13px 11px; border-bottom: 1px solid var(--border); }
    .kanban-header strong { font-size: 12px; }
    .kanban-count { display: grid; place-items: center; min-width: 23px; height: 21px; border-radius: 7px; color: var(--text-muted); background: var(--surface-3); font-size: 10px; font-weight: 800; }
    .kanban-list { display: grid; gap: 9px; padding: 10px; }
    .lead-card { padding: 12px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface); box-shadow: var(--shadow-sm); }
    .lead-card:hover { border-color: var(--primary); }
    .lead-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .lead-card strong { display: block; font-size: 12px; }
    .lead-card p { margin-top: 3px; color: var(--text-muted); font-size: 10px; }
    .lead-detail { display: flex; align-items: center; gap: 6px; margin-top: 12px; padding-top: 9px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 10px; }
    .lead-detail svg { width: 12px; height: 12px; stroke: currentColor; fill: none; }
    .progress { height: 5px; margin-top: 9px; overflow: hidden; border-radius: 99px; background: var(--surface-3); }
    .progress > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--primary), var(--cyan)); }

    .stat-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat-box { padding: 15px 17px; border: 1px solid var(--border); border-radius: 13px; background: var(--surface); }
    .stat-box span { color: var(--text-muted); font-size: 11px; }
    .stat-box strong { display: block; margin-top: 6px; font: 800 21px "Manrope", sans-serif; }
    .module-layout { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, .65fr); gap: 16px; }
    .list-stack { display: grid; gap: 10px; }
    .library-item, .asset-item { display: flex; align-items: center; gap: 11px; padding: 12px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface-2); }
    .item-icon { display: grid; place-items: center; width: 34px; height: 34px; flex: 0 0 auto; border-radius: 9px; color: var(--primary); background: var(--primary-soft); }
    .item-icon svg { width: 17px; height: 17px; stroke: currentColor; fill: none; }
    .item-copy { min-width: 0; flex: 1; }
    .item-copy strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .item-copy span { display: block; margin-top: 2px; color: var(--text-muted); font-size: 10px; }
    .item-value { text-align: right; }
    .item-value strong { display: block; font-size: 12px; }
    .item-value span { color: var(--text-muted); font-size: 10px; }

    .settings-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; }
    .settings-nav { align-self: start; padding: 8px; }
    .settings-tab { display: block; width: 100%; padding: 10px 11px; border: 0; border-radius: 9px; color: var(--text-muted); background: transparent; text-align: left; font-size: 12px; }
    .settings-tab.active, .settings-tab:hover { color: var(--primary); background: var(--primary-soft); font-weight: 700; }
    .permission-table { width: 100%; border-collapse: collapse; }
    .permission-table th, .permission-table td { padding: 12px 10px; border-bottom: 1px solid var(--border); text-align: left; font-size: 11px; }
    .permission-table th { color: var(--text-subtle); font-size: 10px; text-transform: uppercase; }
    .permission-table td:not(:first-child), .permission-table th:not(:first-child) { text-align: center; }
    .permission-toggle { width: 34px; height: 19px; padding: 2px; border: 0; border-radius: 99px; background: var(--surface-3); }
    .permission-toggle span { display: block; width: 15px; height: 15px; border-radius: 50%; background: var(--text-subtle); transition: transform .18s var(--ease), background .18s ease; }
    .permission-toggle.on { background: var(--primary); }
    .permission-toggle.on span { transform: translateX(15px); background: #fff; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 100; display: none; place-items: center; padding: 18px; background: rgba(5, 8, 15, .70); backdrop-filter: blur(8px); }
    .modal-backdrop.open { display: grid; }
    .modal { width: min(560px, 100%); max-height: min(760px, calc(100vh - 36px)); overflow-y: auto; border: 1px solid var(--border-strong); border-radius: 18px; background: var(--bg-elevated); box-shadow: var(--shadow-md); animation: modal-in .2s var(--ease); }
    @keyframes modal-in { from { transform: translateY(12px) scale(.98); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
    .modal-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 19px 21px; border-bottom: 1px solid var(--border); }
    .modal-title { font: 700 16px "Manrope", sans-serif; }
    .modal-header p { margin-top: 3px; color: var(--text-muted); font-size: 11px; }
    .modal-body { padding: 20px 21px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 21px 19px; border-top: 1px solid var(--border); }
    .close-button { display: grid; place-items: center; width: 30px; height: 30px; border: 0; border-radius: 8px; color: var(--text-muted); background: transparent; }
    .close-button:hover { color: var(--text); background: var(--surface-3); }
    .close-button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .form-field { display: grid; gap: 6px; }
    .form-field.full { grid-column: 1 / -1; }
    .form-field label { color: var(--text-muted); font-size: 11px; font-weight: 700; }
    .form-field input, .form-field select, .form-field textarea { width: 100%; padding: 10px 11px; border: 1px solid var(--border-strong); border-radius: 9px; color: var(--text); background: var(--surface-2); outline: 0; font-size: 12px; }
    .form-field textarea { min-height: 88px; resize: vertical; }
    .form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    .field-error { display: none; color: var(--danger); font-size: 10px; }
    .form-field.invalid input, .form-field.invalid select { border-color: var(--danger); }
    .form-field.invalid .field-error { display: block; }

    .toast-stack { position: fixed; right: 20px; bottom: 20px; z-index: 200; display: grid; gap: 9px; width: min(370px, calc(100vw - 40px)); }
    .toast { display: flex; align-items: flex-start; gap: 10px; padding: 13px 14px; border: 1px solid var(--border-strong); border-left: 3px solid var(--toast-color, var(--success)); border-radius: 12px; background: var(--bg-elevated); box-shadow: var(--shadow-md); animation: toast-in .25s var(--ease); }
    .toast-icon { color: var(--toast-color, var(--success)); font-weight: 800; }
    .toast-copy { flex: 1; min-width: 0; }
    .toast-copy strong { display: block; font-size: 12px; }
    .toast-copy span { display: block; margin-top: 2px; color: var(--text-muted); font-size: 11px; }
    @keyframes toast-in { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .offline-banner { display: flex; align-items: center; gap: 8px; padding: 8px 11px; border: 1px solid color-mix(in srgb, var(--warning) 25%, transparent); border-radius: 9px; color: var(--warning); background: var(--warning-soft); font-size: 11px; }
    .offline-banner svg { width: 14px; height: 14px; stroke: currentColor; fill: none; }
    .hide { display: none !important; }

    @media (max-width: 1180px) {
      :root { --sidebar: 226px; }
      .topbar { padding-inline: 22px; }
      .content { padding-inline: 22px; }
      .search { width: 180px; }
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .kanban { grid-template-columns: repeat(2, minmax(210px, 1fr)); }
    }
    @media (max-width: 820px) {

      .search { width: min(200px, 35vw); }

      .settings-nav { display: flex; gap: 4px; overflow-x: auto; }
      .settings-tab { min-width: max-content; }
    }
    @media (max-width: 560px) {

      .page-actions { width: 100%; justify-content: flex-start; }
      .kpi-grid, .stat-strip { grid-template-columns: 1fr 1fr; gap: 10px; }

      .grid-toolbar { align-items: flex-start; flex-direction: column; }

      .grid-footer { align-items: flex-start; flex-direction: column; }
      h1 { font-size: 23px; }
    }

    const gridRegistry = {};
    function grid(id, rows, columns, options = {}) {
      const pageSize = options.pageSize || 6;
      gridRegistry[id] = { rows, columns, pageSize };
      if (!state.grid[id]) state.grid[id] = { page: 1, sortKey: columns.find((c) => c.sortable !== false)?.key || columns[0].key, direction: "asc", query: "", filters: {} };
      const config = state.grid[id];
      const searchable = rows.filter((row) => {
        const global = !config.query || columns.some((col) => col.filterable !== false && String(row[col.key] ?? "").toLowerCase().includes(config.query.toLowerCase()));
        const scoped = Object.entries(config.filters).every(([key, val]) => !val || String(row[key] ?? "").toLowerCase().includes(val.toLowerCase()));
        return global && scoped;
      });
      const sorted = [...searchable].sort((a, b) => { const av = a[config.sortKey] ?? "", bv = b[config.sortKey] ?? ""; return String(av).localeCompare(String(bv), "pt-BR", { numeric: true }) * (config.direction === "asc" ? 1 : -1); });
      const totalPages = Math.max(1, Math.ceil(sorted.length / pageSize));
      config.page = Math.min(config.page, totalPages);
      const visible = sorted.slice((config.page - 1) * pageSize, config.page * pageSize);
      const colHead = columns.map((col) => `<th>${col.sortable === false ? esc(col.label) : `<button class="sort-button" data-grid="${esc(id)}" data-sort="${esc(col.key)}">${esc(col.label)} <span class="sort-icon">${config.sortKey === col.key ? (config.direction === "asc" ? "↑" : "↓") : "↕"}</span></button>`}</th>`).join("");
      const filters = columns.map((col) => col.filterable === false ? "<th></th>" : `<th><input class="column-filter" data-grid="${esc(id)}" data-filter="${esc(col.key)}" value="${esc(config.filters[col.key] || "")}" placeholder="Filtrar…" aria-label="Filtrar ${esc(col.label)}" /></th>`).join("");
      const body = visible.length ? visible.map((row) => `<tr>${columns.map((col) => `<td>${col.format ? col.format(row[col.key], row) : esc(row[col.key] ?? "—")}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${columns.length}"><div class="empty-state"><strong>Nenhum registro encontrado</strong><span>Ajuste os filtros ou cadastre um novo item.</span></div></td></tr>`;
      const start = sorted.length ? (config.page - 1) * pageSize + 1 : 0;

    function isValidCPF(value) {
      const cpf = String(value || "").replace(/\D/g, "");
      if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;
      let sum = 0; for (let i = 0; i < 9; i++) sum += Number(cpf[i]) * (10 - i); let digit = (sum * 10) % 11; if (digit === 10) digit = 0; if (digit !== Number(cpf[9])) return false;
      sum = 0; for (let i = 0; i < 10; i++) sum += Number(cpf[i]) * (11 - i); digit = (sum * 10) % 11; if (digit === 10) digit = 0; return digit === Number(cpf[10]);
    }
    function isValidEmail(value) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/i.test(String(value || "").trim()); }
    function validateForm(form) {
      let valid = true;
      $$(".form-field", form).forEach((field) => { const input = $("input, select, textarea", field); let fieldValid = input ? input.checkValidity() : true; if (input?.id === "student-cpf") fieldValid = isValidCPF(input.value); if (input?.type === "email") fieldValid = isValidEmail(input.value); field.classList.toggle("invalid", !fieldValid); valid = valid && fieldValid; });
      if (!valid) notify("Revise os campos destacados", "CPF, e-mail e campos obrigatórios precisam estar válidos.", "error");
      return valid;
    }

    async function submitForm(event) {

      let table = "", payload = value;
      if (kind === "student") { table = "alunos"; const newStudent = { id: `a${Date.now()}`, ra: String(20250000 + state.data.alunos.length + 1), nome: value["student-name"], email: value["student-email"], curso: value["student-course"], periodo: value["student-period"], status: value["student-status"], ingresso: today }; state.data.alunos.unshift(newStudent); }
      if (kind === "lead") { table = "leads"; state.data.leads.unshift({ id: `l${Date.now()}`, nome: value["lead-name"], origem: value["lead-source"], curso: value["lead-course"], valor: 1180, owner: "José Cauan", stage: "Novo lead", score: 50, last: "agora" }); }
      if (kind === "book") { table = "biblioteca_itens"; state.data.biblioteca.unshift({ id: `b${Date.now()}`, tombo: value["book-code"], titulo: value["book-title"], autor: value["book-author"], categoria: value["book-category"], tipo: value["book-type"], status: "Disponível", exemplares: Number(value["book-quantity"]) }); }
      if (kind === "asset") { table = "patrimonios"; state.data.estoque.unshift({ id: `p${Date.now()}`, patrimonio: value["asset-code"], item: value["asset-name"], categoria: value["asset-category"], local: value["asset-location"], responsavel: value["asset-owner"], valor: Number(value["asset-value"]), status: "Em uso" }); }
      if (kind === "user") { table = "usuarios"; state.data.usuarios.unshift({ id: `r${Date.now()}`, nome: value["user-name"], email: value["user-email"], perfil: value["user-role"], ultimoAcesso: "aguardando convite", status: value["user-status"] }); }
      if (state.supabase.configured) { const result = await DataService.insert(table, payload); if (result.error) { notify("Cadastro não concluído", "O Supabase recusou a operação. Nenhuma alteração foi confirmada.", "error"); return; } }
      closeModal(); await navigate(state.currentRoute, { fast: true }); notify("Cadastro salvo", state.supabase.configured ? "Registro sincronizado com o Supabase." : "Registro adicionado ao modo local demonstrativo.");
    }

    function getFilteredRows(gridId) {
      const entry = gridRegistry[gridId]; if (!entry) return [];
      const config = state.grid[gridId]; return entry.rows.filter((row) => { const global = !config.query || entry.columns.some((col) => col.filterable !== false && String(row[col.key] ?? "").toLowerCase().includes(config.query.toLowerCase())); const scoped = Object.entries(config.filters || {}).every(([key, val]) => !val || String(row[key] ?? "").toLowerCase().includes(val.toLowerCase())); return global && scoped; });
    }
    function exportGrid(gridId, type) {
      const entry = gridRegistry[gridId]; if (!entry) { notify("Exportação indisponível", "Abra uma página com uma tabela para exportar.", "warning"); return; }
      const rows = getFilteredRows(gridId); const cols = entry.columns.filter((col) => col.key !== "actions");
      if (type === "csv") { const csv = [cols.map((col) => `"${col.label.replaceAll('"', '""')}"`).join(","), ...rows.map((row) => cols.map((col) => `"${String(row[col.key] ?? "").replaceAll('"', '""')}"`).join(","))].join("\n"); download(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" }), `${gridId}-${today}.csv`); notify("CSV exportado", `${rows.length} registros preparados para download.`); return; }
      if (!window.jspdf?.jsPDF) { notify("PDF indisponível", "A biblioteca de exportação não foi carregada. Verifique sua conexão.", "error"); return; }
      const doc = new window.jspdf.jsPDF({ orientation: cols.length > 6 ? "landscape" : "portrait" }); doc.setFontSize(16); doc.text(`SisGESC — ${gridId}`, 14, 16); doc.setFontSize(9); doc.setTextColor(110); doc.text(`Exportado em ${new Date().toLocaleString("pt-BR")}`, 14, 23); doc.autoTable({ startY: 30, head: [cols.map((col) => col.label)], body: rows.map((row) => cols.map((col) => String(row[col.key] ?? "—"))), styles: { fontSize: 8, cellPadding: 3 }, headStyles: { fillColor: [96, 70, 217] } }); doc.save(`${gridId}-${today}.pdf`); notify("PDF exportado", `${rows.length} registros incluídos no relatório.`);
    }
    function download(blob, filename) { const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = filename; link.click(); URL.revokeObjectURL(link.href); }

    async function syncData() { showLoading(); await new Promise((resolve) => setTimeout(resolve, 400)); if (state.supabase.configured) { state.data.alunos = await DataService.read("vw_alunos_detalhe", state.data.alunos); state.data.turmas = await DataService.read("vw_turmas_detalhe", state.data.turmas); } await navigate(state.currentRoute, { fast: true }); notify("Sincronização concluída", state.supabase.configured ? "Os dados foram atualizados do Supabase." : "Modo local demonstrativo ativo."); }
    function closeSidebar() { $("#sidebar").classList.remove("mobile-open"); $("#sidebarBackdrop").classList.remove("open"); }
    function openSidebar() { $("#sidebar").classList.add("mobile-open"); $("#sidebarBackdrop").classList.add("open"); }

    document.addEventListener("click", async (event) => {
      const routeNode = event.target.closest("[data-route]"); if (routeNode) { event.preventDefault(); navigate(routeNode.dataset.route); return; }
      const actionNode = event.target.closest("[data-action]"); if (!actionNode) return;
      const action = actionNode.dataset.action;
      if (action === "close-modal") closeModal();
      if (action === "sync") syncData();
      if (action === "new") openModal("student");
      if (action === "new-lead") openModal("lead");
      if (action === "new-book") openModal("book");
      if (action === "new-asset") openModal("asset");
      if (action === "new-user") openModal("user");
      if (["new-class", "new-grade", "new-charge", "new-employee", "toast-placeholder"].includes(action)) notify("Fluxo preparado", "Esta ação está pronta para ser conectada ao serviço de domínio correspondente.");
      if (action === "notifications") notify("Central de notificações", "Você tem 3 alertas operacionais para revisar.", "warning");
      if (action === "profile") notify("Perfil do administrador", "Gerencie suas preferências em Configurações & RBAC.");
      if (action === "view-student") notify("Perfil do aluno", "A visão 360º do estudante será aberta em um painel lateral.");
      if (action === "collect") notify("Cobrança agendada", "O lembrete foi preparado para envio ao responsável.");
      if (action === "view-finance" || action === "edit-user" || action === "row-menu") notify("Ação registrada", "O item foi selecionado para edição.");
      if (action === "export-csv" || action === "export-pdf") exportGrid(actionNode.dataset.grid, action === "export-csv" ? "csv" : "pdf");
      if (action === "export-bi") notify("Relatório BI preparado", "A exportação consolidada será disponibilizada em breve.");
      if (action === "toggle-permission") { actionNode.classList.toggle("on"); notify("Permissão atualizada", "A matriz foi alterada localmente. Salve para persistir no RBAC."); }
      if (action === "settings-tab") { $$(".settings-tab").forEach((tab) => tab.classList.remove("active")); actionNode.classList.add("active"); if (actionNode.textContent.includes("Auditoria")) $("[data-grid=auditoria]")?.scrollIntoView({ behavior: "smooth", block: "center" }); }
      if (action === "mobile-menu") openSidebar();
    });
    document.addEventListener("input", (event) => { const node = event.target; if (node.matches(".grid-search")) { state.grid[node.dataset.grid].query = node.value; state.grid[node.dataset.grid].page = 1; navigate(state.currentRoute, { fast: true, skipHistory: true }); } if (node.matches(".column-filter")) { state.grid[node.dataset.grid].filters[node.dataset.filter] = node.value; state.grid[node.dataset.grid].page = 1; navigate(state.currentRoute, { fast: true, skipHistory: true }); } });
    document.addEventListener("click", (event) => { const sort = event.target.closest("[data-sort]"); if (sort) { const config = state.grid[sort.dataset.grid]; config.direction = config.sortKey === sort.dataset.sort && config.direction === "asc" ? "desc" : "asc"; config.sortKey = sort.dataset.sort; navigate(state.currentRoute, { fast: true, skipHistory: true }); return; } const page = event.target.closest("[data-page]"); if (page) { const config = state.grid[page.dataset.grid]; const total = Math.max(1, Math.ceil(getFilteredRows(page.dataset.grid).length / gridRegistry[page.dataset.grid].pageSize)); config.page = page.dataset.page === "prev" ? Math.max(1, config.page - 1) : page.dataset.page === "next" ? Math.min(total, config.page + 1) : Number(page.dataset.page); navigate(state.currentRoute, { fast: true, skipHistory: true }); } });
    $("#themeToggle").addEventListener("click", () => setTheme(state.theme === "dark" ? "light" : "dark"));
    $("#mobileMenu").addEvent

    $("#mobileMenu").addEventListener("click", openSidebar);
    $("#sidebarBackdrop").addEventListener("click", closeSidebar);
    $("#modalBackdrop").addEventListener("click", (event) => { if (event.target.id === "modalBackdrop") closeModal(); });
    $("#entityForm").addEventListener("submit", submitForm);
    window.addEventListener("popstate", () => navigate(location.hash.slice(1) || "dashboard", { fast: true, skipHistory: true }));
    window.addEventListener("online", () => { setConnection(true); notify("Conexão restaurada", "O navegador voltou a ficar online."); });
    window.addEventListener("offline", () => { setConnection(false); notify("Você está offline", "A interface continua disponível em modo local.", "warning"); });
    document.addEventListener("keydown", (event) => { if (event.key === "Escape") { closeModal(); closeSidebar(); } if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") { event.preventDefault(); $("#globalSearch")?.focus(); } });
    $("#globalSearch").addEventListener("keydown", (event) => { if (event.key === "Enter" && event.target.value.trim()) { notify("Busca global", `Pesquisa por “${event.target.value.trim()}” pronta para conectar ao índice de busca.`); } });

    setTheme(state.theme);
    setConnection(navigator.onLine && state.supabase.configured);
    navigate(location.hash.slice(1) || "dashboard");
    if (state.supabase.configured) DataService.healthCheck();
  </script>
</body>
